<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT 헬프데스크</title>
<!--
  IT 헬프데스크 1차 응대 Agent — 채팅 화면
  - GET / 로 이 파일이 열리고, 질문은 POST /query 로 보냅니다. (API 규약은 그대로)
  - 외부 CDN 을 쓰지 않습니다. 사내망에서도 이 파일 하나로 동작합니다.
  - 응답의 contexts 는 '출처' 배지로, trace 는 '처리 과정' 목록으로 보여 줍니다.
  - 화면에 나오는 사번·이름은 모두 교육용 더미 데이터입니다.
-->
<style>
  /* ── 색상 토큰: 라이트 모드 기본값 ───────────────────────── */
  :root {
    --bg: #f4f5f9;
    --panel: #ffffff;
    --text: #1d2130;
    --muted: #6b7185;
    --line: #e3e6ef;
    --accent: #4f5bd5;
    --accent-weak: #eceefe;
    --user-bubble: #4f5bd5;
    --user-text: #ffffff;
    --bot-bubble: #ffffff;
    --chip: #f0f1f7;
    --ok: #1f8a5b;      --ok-bg: #e6f5ee;
    --warn: #a8660b;    --warn-bg: #fdf1df;
    --danger: #c0392b;  --danger-bg: #fbe9e7;
    --shadow: 0 1px 2px rgba(20, 24, 40, .06), 0 4px 16px rgba(20, 24, 40, .05);
  }
  /* ── 다크 모드: OS 설정을 따릅니다 ───────────────────────── */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141c;
      --panel: #1a1d28;
      --text: #e6e8f0;
      --muted: #9097ab;
      --line: #2a2e3d;
      --accent: #8b94f5;
      --accent-weak: #262a45;
      --user-bubble: #5a64dc;
      --user-text: #ffffff;
      --bot-bubble: #1f2230;
      --chip: #242838;
      --ok: #5fd3a0;      --ok-bg: #173226;
      --warn: #f0b562;    --warn-bg: #3a2c14;
      --danger: #f08a7e;  --danger-bg: #3b1d1a;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.6;
  }

  /* ── 전체 레이아웃: 헤더 / 대화 / 입력창 ───────────────────── */
  .app {
    display: flex; flex-direction: column;
    height: 100dvh; max-width: 860px; margin: 0 auto;
    background: var(--panel);
    border-left: 1px solid var(--line); border-right: 1px solid var(--line);
  }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
  }
  .logo {
    width: 38px; height: 38px; border-radius: 10px; flex: none;
    display: grid; place-items: center;
    background: var(--accent); color: #fff;
  }
  .title { flex: 1; min-width: 0; }
  .title h1 { margin: 0; font-size: 16px; font-weight: 700; }
  .title p { margin: 0; font-size: 12.5px; color: var(--muted); }
  .title .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--ok); margin-right: 5px; vertical-align: 1px;
  }
  .user-select { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
  .user-select select {
    font: inherit; color: var(--text); background: var(--chip);
    border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px;
  }

  /* ── 대화 영역 ───────────────────────────────────────────── */
  main { flex: 1; overflow-y: auto; padding: 24px 20px 8px; scroll-behavior: smooth; }

  .welcome { text-align: center; padding: 28px 8px 12px; }
  .welcome .big {
    width: 56px; height: 56px; margin: 0 auto 12px; border-radius: 16px;
    display: grid; place-items: center; background: var(--accent-weak); color: var(--accent);
  }
  .welcome h2 { margin: 0 0 4px; font-size: 19px; }
  .welcome p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  .suggestions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .suggestions button {
    font: inherit; font-size: 13.5px; color: var(--text); cursor: pointer;
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 14px; transition: border-color .15s, background .15s;
  }
  .suggestions button:hover { border-color: var(--accent); background: var(--accent-weak); }

  .row { display: flex; gap: 10px; margin: 14px 0; align-items: flex-start; }
  .row.user { justify-content: flex-end; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%; flex: none;
    display: grid; place-items: center; font-size: 13px; font-weight: 700;
    background: var(--accent-weak); color: var(--accent);
  }
  .bubble {
    max-width: min(78%, 620px);
    padding: 10px 14px; border-radius: 16px;
    overflow-wrap: anywhere;
  }
  .row.user .bubble {
    background: var(--user-bubble); color: var(--user-text);
    border-bottom-right-radius: 4px; white-space: pre-wrap;
  }
  .row.bot .bubble {
    background: var(--bot-bubble); border: 1px solid var(--line);
    border-top-left-radius: 4px; box-shadow: var(--shadow);
  }
  .bubble p { margin: 0 0 6px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 4px 0 6px; padding-left: 20px; }
  .bubble code { background: var(--chip); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .meta-time { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .row.user .meta-time { text-align: right; color: rgba(255,255,255,.75); }

  .system-note { text-align: center; font-size: 12px; color: var(--muted); margin: 14px 0; }
  .system-note span { background: var(--chip); padding: 4px 12px; border-radius: 999px; }

  /* 상태 배지: 차단 / 승인 대기 / 오류 */
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px;
    margin-bottom: 6px;
  }
  .badge.blocked { color: var(--danger); background: var(--danger-bg); }
  .badge.pending { color: var(--warn); background: var(--warn-bg); }
  .badge.error   { color: var(--danger); background: var(--danger-bg); }

  /* 출처(contexts) */
  .sources { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .sources .label { font-size: 12px; color: var(--muted); margin-right: 4px; }
  .source-chip {
    font: inherit; font-size: 12px; cursor: pointer;
    color: var(--accent); background: var(--accent-weak);
    border: 0; border-radius: 6px; padding: 2px 8px; margin: 2px 4px 2px 0;
  }
  .source-chip[aria-expanded="true"] { outline: 1px solid var(--accent); }
  .source-text {
    margin-top: 6px; padding: 8px 10px; font-size: 12.5px; color: var(--muted);
    background: var(--chip); border-radius: 8px; white-space: pre-wrap;
    max-height: 180px; overflow-y: auto;
  }

  /* 처리 과정(trace) */
  details.trace { margin-top: 8px; font-size: 12.5px; }
  details.trace summary { cursor: pointer; color: var(--muted); list-style: none; user-select: none; }
  details.trace summary::-webkit-details-marker { display: none; }
  details.trace summary::before { content: "▸ "; }
  details.trace[open] summary::before { content: "▾ "; }
  .steps { margin: 8px 0 0; padding: 0; list-style: none; border-left: 2px solid var(--line); }
  .steps li { position: relative; padding: 2px 0 8px 14px; }
  .steps li::before {
    content: ""; position: absolute; left: -6px; top: 8px;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--panel); border: 2px solid var(--accent);
  }
  .steps .name { font-weight: 700; font-family: ui-monospace, Consolas, monospace; }
  .steps .io { color: var(--muted); font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; overflow-wrap: anywhere; }

  /* 답 기다리는 중 */
  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing i {
    width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  .retry {
    font: inherit; font-size: 12.5px; margin-top: 6px; cursor: pointer;
    color: var(--accent); background: none; border: 1px solid var(--accent);
    border-radius: 6px; padding: 2px 10px;
  }

  /* ── 입력창 ─────────────────────────────────────────────── */
  footer { padding: 12px 20px 16px; border-top: 1px solid var(--line); }
  .composer {
    display: flex; align-items: flex-end; gap: 8px;
    background: var(--chip); border: 1px solid var(--line); border-radius: 14px;
    padding: 8px 8px 8px 14px; transition: border-color .15s;
  }
  .composer:focus-within { border-color: var(--accent); }
  textarea {
    flex: 1; resize: none; border: 0; outline: 0; background: transparent;
    color: var(--text); font: inherit; max-height: 140px; padding: 4px 0;
  }
  textarea::placeholder { color: var(--muted); }
  #send {
    width: 38px; height: 38px; border-radius: 10px; border: 0; flex: none;
    background: var(--accent); color: #fff; cursor: pointer;
    display: grid; place-items: center; transition: opacity .15s;
  }
  #send:disabled { opacity: .4; cursor: not-allowed; }
  .hint { font-size: 11.5px; color: var(--muted); margin-top: 6px; text-align: center; }

  /* ── 좁은 화면(휴대폰) ──────────────────────────────────── */
  @media (max-width: 560px) {
    header { padding: 10px 16px; flex-wrap: wrap; }
    main { padding: 16px 16px 8px; }
    footer { padding: 10px 16px 12px; }
    .bubble { max-width: 86%; }
    .avatar { display: none; }
    .user-select { width: 100%; justify-content: flex-end; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>
    </div>
    <div class="title">
      <h1>IT 헬프데스크</h1>
      <p><span class="dot"></span>1차 응대 Agent · 가이드 문서와 내 계정 정보로 답해요</p>
    </div>
    <label class="user-select">
      요청자
      <!-- 교육용 더미 데이터입니다. 실제 운영이라면 SSO 세션에서 사번을 가져옵니다. -->
      <select id="userId">
        <option value="E100001">E100001 홍길동</option>
        <option value="E100002">E100002 김철수</option>
      </select>
    </label>
  </header>

  <main id="chat" aria-live="polite">
    <section class="welcome" id="welcome">
      <div class="big" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </div>
      <h2>무엇을 도와드릴까요?</h2>
      <p>VPN, 계정·비밀번호, SW 설치·라이선스 문의에 답해 드려요.</p>
      <div class="suggestions">
        <button type="button">VPN이 연결되지 않아요</button>
        <button type="button">제 계정이 잠겼나요?</button>
        <button type="button">계정 잠금 해제해 주세요</button>
        <button type="button">제 노트북 라이선스 만료일 알려 주세요</button>
        <button type="button">개인 SW를 설치해도 되나요?</button>
      </div>
    </section>
  </main>

  <footer>
    <form class="composer" id="form">
      <textarea id="input" rows="1" placeholder="IT 관련 질문을 입력하세요" aria-label="질문 입력"></textarea>
      <button id="send" type="submit" aria-label="전송" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
      </button>
    </form>
    <div class="hint">Enter 전송 · Shift+Enter 줄바꿈 · 계정 잠금 해제는 담당자 승인 후 처리됩니다</div>
  </footer>
</div>

<script>
(() => {
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const userSel = document.getElementById("userId");
  const welcome = document.getElementById("welcome");
  let busy = false;

  // ── 작은 도우미 함수들 ─────────────────────────────────────
  // 서버 응답을 HTML 로 넣기 전에 반드시 이스케이프합니다. (XSS 방지)
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const now = () => new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
  const scrollDown = () => { chat.scrollTop = chat.scrollHeight; };

  // LLM 답변의 간단한 마크다운(굵게, 코드, 목록, 줄바꿈)만 처리합니다.
  // 먼저 전체를 이스케이프한 뒤 표시용 태그만 다시 붙이므로 안전합니다.
  function renderMarkdown(text) {
    const lines = esc(text).split(/\r?\n/);
    let html = "", list = null;
    const inline = (s) => s
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/`([^`]+)`/g, "<code>$1</code>");
    const closeList = () => { if (list) { html += `</${list}>`; list = null; } };
    for (const raw of lines) {
      const line = raw.trim();
      const ul = line.match(/^[-*•]\s+(.*)$/);
      const ol = line.match(/^\d+[.)]\s+(.*)$/);
      if (ul || ol) {
        const tag = ul ? "ul" : "ol";
        if (list !== tag) { closeList(); html += `<${tag}>`; list = tag; }
        html += `<li>${inline((ul || ol)[1])}</li>`;
      } else if (line === "") {
        closeList();
      } else {
        closeList();
        html += `<p>${inline(line.replace(/^#{1,6}\s+/, ""))}</p>`;
      }
    }
    closeList();
    return html;
  }

  function addRow(role, innerHtml) {
    if (welcome.isConnected) welcome.remove();
    const row = document.createElement("div");
    row.className = `row ${role}`;
    row.innerHTML = role === "bot"
      ? `<div class="avatar" aria-hidden="true">IT</div><div class="bubble">${innerHtml}</div>`
      : `<div class="bubble">${innerHtml}</div>`;
    chat.appendChild(row);
    scrollDown();
    return row;
  }

  function addNote(text) {
    const div = document.createElement("div");
    div.className = "system-note";
    div.innerHTML = `<span>${esc(text)}</span>`;
    chat.appendChild(div);
    scrollDown();
  }

  // ── 응답 해석: trace 를 보고 상태 배지를 고릅니다 ─────────────
  // guard 단계 output 이 'pass' 가 아니면 가드레일에서 막힌 요청입니다.
  // unlock_account 단계 output 에 pending_approval 이 있으면 승인 대기입니다.
  function statusOf(data) {
    const trace = data.trace || [];
    const guard = trace.find((t) => t.step === "guard");
    if (guard && guard.output && guard.output !== "pass") return "blocked";
    if (trace.some((t) => t.step === "unlock_account" && String(t.output).includes("pending_approval"))) return "pending";
    return null;
  }

  function renderSources(contexts) {
    if (!contexts || !contexts.length) return "";
    // 같은 문서에서 여러 조각이 나오면 하나의 배지로 묶습니다.
    const byDoc = new Map();
    for (const c of contexts) {
      const id = c.doc_id || "문서";
      if (!byDoc.has(id)) byDoc.set(id, []);
      byDoc.get(id).push(c.text || "");
    }
    let chips = "";
    for (const [id, texts] of byDoc) {
      chips += `<button type="button" class="source-chip" aria-expanded="false" data-text="${esc(texts.join("\n\n─────\n\n"))}">📄 ${esc(id)}</button>`;
    }
    return `<div class="sources"><span class="label">출처</span>${chips}<div class="source-slot"></div></div>`;
  }

  function renderTrace(trace) {
    if (!trace || !trace.length) return "";
    const flow = trace.map((t) => t.step).join(" → ");
    const items = trace.map((t) => {
      const io = [t.input && `입력: ${t.input}`, t.output && `결과: ${t.output}`].filter(Boolean).join("\n");
      return `<li><span class="name">${esc(t.step)}</span>${io ? `<div class="io">${esc(io).replace(/\n/g, "<br>")}</div>` : ""}</li>`;
    }).join("");
    return `<details class="trace"><summary>처리 과정 · ${esc(flow)}</summary><ul class="steps">${items}</ul></details>`;
  }

  function renderAnswer(data) {
    const status = statusOf(data);
    const badge = status === "blocked" ? `<span class="badge blocked">⛔ 정책에 따라 차단됨</span>`
                : status === "pending" ? `<span class="badge pending">⏳ 담당자 승인 대기</span>` : "";
    return `${badge}${renderMarkdown(data.answer)}${renderSources(data.contexts)}${renderTrace(data.trace)}<div class="meta-time">${now()}</div>`;
  }

  // 출처 배지를 누르면 해당 문서 조각을 펼치고, 다시 누르면 접습니다.
  chat.addEventListener("click", (e) => {
    const chip = e.target.closest(".source-chip");
    if (!chip) return;
    const box = chip.closest(".sources");
    const slot = box.querySelector(".source-slot");
    const wasOpen = chip.getAttribute("aria-expanded") === "true";
    box.querySelectorAll(".source-chip").forEach((c) => c.setAttribute("aria-expanded", "false"));
    slot.innerHTML = wasOpen ? "" : `<div class="source-text">${esc(chip.dataset.text)}</div>`;
    if (!wasOpen) chip.setAttribute("aria-expanded", "true");
  });

  // ── 질문 보내기: POST /query ─────────────────────────────
  async function ask(question) {
    if (busy || !question.trim()) return;
    busy = true; updateSend();
    addRow("user", `${esc(question)}<div class="meta-time">${now()}</div>`);
    const pending = addRow("bot", `<div class="typing" aria-label="답변 작성 중"><i></i><i></i><i></i></div>`);
    const bubble = pending.querySelector(".bubble");
    try {
      const res = await fetch("query", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, user_id: userSel.value }),
      });
      if (!res.ok) throw new Error(`서버 응답 ${res.status}`);
      bubble.innerHTML = renderAnswer(await res.json());
    } catch (err) {
      bubble.innerHTML = `<span class="badge error">⚠ 연결 오류</span><p>답변을 받지 못했어요. (${esc(err.message)})</p><button type="button" class="retry">다시 시도</button>`;
      bubble.querySelector(".retry").addEventListener("click", () => { pending.previousElementSibling?.remove(); pending.remove(); ask(question); });
    } finally {
      busy = false; updateSend(); scrollDown(); input.focus();
    }
  }

  // ── 입력창 동작 ──────────────────────────────────────────
  function updateSend() { send.disabled = busy || !input.value.trim(); }
  function autoGrow() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 140) + "px"; }

  input.addEventListener("input", () => { autoGrow(); updateSend(); });
  input.addEventListener("keydown", (e) => {
    // 한글 조합 중(isComposing) Enter 는 글자 확정용이므로 전송하지 않습니다.
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); }
  });
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const q = input.value;
    input.value = ""; autoGrow(); updateSend();
    ask(q);
  });
  welcome.querySelectorAll(".suggestions button").forEach((b) => b.addEventListener("click", () => ask(b.textContent)));
  userSel.addEventListener("change", () => addNote(`요청자가 ${userSel.selectedOptions[0].textContent}(으)로 바뀌었어요`));
  input.focus();
})();
</script>
</body>
</html>
